name: Деплой на Джино

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-jino
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Проверка сайта
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ссылки, ресурсы, внешние зависимости
        run: node scripts/check.mjs

  deploy:
    name: Выгрузка по FTP
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ecotechnew.ru/
    steps:
      - uses: actions/checkout@v4

      - name: Сборка каталога публикации
        run: |
          mkdir -p dist
          cp index.html 404.html robots.txt sitemap.xml favicon.ico .htaccess dist/
          cp -r assets dist/
          find dist -type f | sort

      - name: Выгрузка на Джино
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: 21
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'domains/ecotechnew.ru/' }}
          dangerous-clean-slate: false
          log-level: standard
